<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verve Desktop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Verve Desktop</h1>
      <p class="subtitle">Native window, native webview, zero Electron.</p>
    </header>
    <main>
      <section class="card">
        <h2>IPC round-trip</h2>
        <div class="row">
          <button id="ping">Send ping</button>
        </div>
      </section>

      <section class="card">
        <h2>Cookies</h2>
        <div class="row">
          <input id="cookie-name" type="text" value="verve_demo" />
          <input id="cookie-value" type="text" value="hello" />
          <button id="cookie-set">Set</button>
          <button id="cookie-get">Get</button>
          <button id="cookie-clear">Clear all</button>
        </div>
      </section>

      <section class="card">
        <h2>Multi-window</h2>
        <div class="row">
          <button id="open-child">Open child window</button>
        </div>
      </section>

      <section class="card">
        <h2>Log</h2>
        <pre id="log">bridge ready</pre>
      </section>
    </main>
    <script>
      // window.verve is injected at document-start by the framework,
      // so it's already defined before this inline script runs.
      const logEl = document.getElementById('log');
      function log(msg) {
        logEl.textContent = msg + '\n' + logEl.textContent;
      }

      async function call(type, args) {
        log('→ ' + type + ' ' + JSON.stringify(args || {}));
        try {
          const reply = await window.verve.request(Object.assign({ type }, args || {}));
          log('← ' + JSON.stringify(reply));
        } catch (err) {
          log('✕ ' + err.message);
        }
      }

      document.getElementById('ping').addEventListener('click', () => {
        call('ping', { sent_at: Date.now() });
      });

      document.getElementById('cookie-set').addEventListener('click', () => {
        call('cookie_set', {
          name: document.getElementById('cookie-name').value,
          value: document.getElementById('cookie-value').value,
        });
      });

      document.getElementById('cookie-get').addEventListener('click', () => {
        call('cookie_get', { name: document.getElementById('cookie-name').value });
      });

      document.getElementById('cookie-clear').addEventListener('click', () => {
        call('cookie_clear');
      });

      document.getElementById('open-child').addEventListener('click', () => {
        call('open_child');
      });
    </script>
  </body>
</html>
