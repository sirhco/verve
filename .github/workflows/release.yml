name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Must already exist on origin.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            asset_suffix: x86_64-linux
          - target: aarch64-linux-gnu
            asset_suffix: aarch64-linux
          - target: x86_64-macos
            asset_suffix: x86_64-macos
          - target: aarch64-macos
            asset_suffix: aarch64-macos
          # x86_64-windows-gnu is intentionally absent — verve-server
          # uses posix APIs and verve-cli's realpath path needs libc
          # linkage on Windows. Both are tracked follow-ups (roadmap
          # #20 — release tarball Windows coverage).

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig version
        run: zig version

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip leading `v` for the asset filename version.
          VERSION="${TAG#v}"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: zig build (release)
        run: |
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseSafe

      - name: Stage release artifacts
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          SUFFIX="${{ matrix.asset_suffix }}"
          STAGE="verve-${VERSION}-${SUFFIX}"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/bin"
          cp zig-out/bin/verve-server "${STAGE}/bin/"
          cp zig-out/bin/verve-cli    "${STAGE}/bin/"
          cp LICENSE README.md CHANGELOG.md "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          # Generate a sha256 alongside so users can verify.
          if command -v sha256sum >/dev/null; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi
          echo "tarball=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${STAGE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verve-${{ steps.tag.outputs.version }}-${{ matrix.asset_suffix }}
          path: |
            ${{ steps.stage.outputs.tarball }}
            ${{ steps.stage.outputs.checksum }}
          retention-days: 7

  publish:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release_assets/ \;
          ls -la release_assets

      - name: Extract changelog section for this tag
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          # Pull the section between `## [VERSION]` and the next `## ` heading.
          awk -v v="${VERSION}" '
            BEGIN { in_section=0 }
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" v "]") > 0) { in_section=1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for ${TAG}; falling back to autogenerated notes."
            echo "auto=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.auto == 'false' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.auto == 'true' }}
          files: release_assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
